[theme]
name = "tokyo-night"

[keys]
previous_tab = ""
next_tab = ""
switch_tab = ""
previous_agent = "prefix+p"
next_agent = "prefix+n"
focus_agent = "prefix+1..9"

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "system"
delay_seconds = 1
